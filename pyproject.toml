[project]
name = "personal-ai-site"
version = "0.2.0"
description = "AI-powered personal website using Flask and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "ollama>=0.5.1",
    "requests>=2.32.4", # Required by ollama for HTTP requests
    "ruff>=0.11.11", # Code linting and formatting
]
